{% extends 'shop/basic.html' %}

{% block body %}

<div class="container">
    <div class="col my-4">
        <h2>Step 1 - Check and Review the items</h2>
        <div class="items">
            <ul class="list-group">
                <li class="list-group-item">
                <div class="row fw-bold">
                <div class="col">Name</div>
                <div class="col-2 text-center">Quantity</div>
                <div class="col-2 text-end">Price ₹</div>
                <div class="col-2 text-end">Total ₹</div>
                </li>
            </ul>
        </div>
    </div>
    <div class="col my-4">
        <h2>Step 2 - Enter your details</h2>
        <form action="{% url 'checkout' %}" method="post" id="checkoutform">
            {% csrf_token %}
            <input type="hidden" name="cart" id="cartdata">
            <input type="hidden" name="amount" id="amount">
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="name">Name</label>
                    <input type="name" class="form-control" id="name" name="name" placeholder="Name">
                </div>
                <div class="form-group col-md-6">
                    <label for="inputEmail4">Email</label>
                    <input type="email" class="form-control" id="inputEmail4" placeholder="Email" name="email">
                </div>
            </div>
            <div class="form-group">
                <label for="inputAddress">Address</label>
                <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St" name="address1">
            </div>
            <div class="form-group">
                <label for="inputAddress2">Address Line 2</label>
                <input type="text" class="form-control" name="address2" id="inputAddress2" placeholder="Apartment, studio, or floor">
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="inputCity">City</label>
                    <input type="text" class="form-control" name="city" id="inputCity">
                </div>
                <div class="form-group col-md-4">
                    <label for="inputState">State</label>
                    <input type="text" class="form-control" id="inputAddress3" name="state" placeholder="Enter State">
                    </select>
                </div>
                <div class="form-group col-md-2">
                    <label for="inputZip">Zip</label>
                    <input type="text" class="form-control" name="zipcode" id="inputZip">
                </div>
            </div>
            <div class="form-group">
                <label for="inputZip">Phone Number</label>
                <input type="tel" name="phone" class="form-control" id="inputPhone">
            </div>
            <button type="submit" class="btn btn-primary">Place Order</button>
        </form>
    </div>
</div>
{% endblock %}

{% block js %}
<script>

function fetch_cart_details(){
    let cart = JSON.parse(localStorage.getItem('cart') || '{}')
    let ids = Object.keys(cart);
    let idsstring = ids.join(',');
    let grandtotal = 0;
    let cartlen=0;
    let str=`<ul class="list-group">
    <li class="list-group-item">
        <div class="row fw-bold">
            <div class="col">Name</div>
            <div class="col-2 text-center">Quantity</div>
            <div class="col-2 text-end">Price ₹</div>
            <div class="col-2 text-end">Total ₹</div>
        </div>
    </li>`;
    fetch('/shop/get_cart_products/?ids=' + idsstring)
    .then(response => response.json())
    .then(data=>{
        data.forEach(product => {
            let quantity = cart[product.id];
            cartlen += quantity
            let total = product.price * quantity;
            grandtotal += total ;
            let item = `
            <li class="list-group-item">
                <div class="row">
                    <div class="col">
                        ${product.product_name}
                    </div>

                    <div class="col-2 text-center">
                        ${quantity}
                    </div>

                    <div class="col-2 text-end">
                        ₹${product.price}
                    </div>

                    <div class="col-2 text-end">
                        ₹${total}
                    </div>
                </div>
            </li>
        `;

                str += item;
            });
            str += `
                <li class="list-group-item">
                    <div class="row fw-bold">
                        <div class="col text-end">
                            Grand Total:
                        </div>

                        <div class="col-2 text-end" id="grandtotal">
                            ₹${grandtotal}
                        </div>
                    </div>
                </li>
            `;
            document.querySelector('.items').innerHTML = str;
            document.querySelector("#popcart").innerHTML = cartlen;
    })
}
fetch_cart_details();

document.querySelector('#checkoutform').addEventListener('submit', function(){
    let cart = localStorage.getItem('cart');
    $('#amount').val($('#grandtotal').text().trim());
    document.querySelector('#cartdata').value = cart;
});
{% if thank %}
    alert("Thanks for ordering with us. Your order id is {{ id }}. Use it to track your order using our order tracker");
    localStorage.removeItem('cart')
    document.location = '/shop/';
{% endif %}
</script>
{% endblock %}
