<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Click & Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 420px;">

        <h2 class="text-center mb-2">Welcome Back!</h2>
        <p class="text-center text-muted mb-4">Login to your Click & Cart account</p>

        {% if form.errors %}
            <div class="alert alert-danger">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3 w-100">
                <label for="username" class="form-label">Username</label><br>
                <input class="w-100" type="text" name="username" id="username" placeholder="Enter username" required>
            </div>

            <div class="mb-3 w-100">
                <label for="password" class="form-label">Password</label><br>
                <input class="w-100" type="password" name="password" id="password" placeholder="Enter password" required
    >


        </div>

            <button type="submit" class="btn btn-primary w-100">
                Login
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>

    </div>
</div>

</body>
</html>
